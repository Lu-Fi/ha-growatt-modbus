dump_registers:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: growatt_modbus_lufi
    include_input:
      required: false
      default: false
      selector:
        boolean:

battery_first_write_test:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: growatt_modbus_lufi
    window:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    method:
      required: false
      default: both
      selector:
        select:
          options:
            - single
            - block
            - both
          translation_key: write_test_method
    confirm:
      required: true
      default: false
      selector:
        boolean:
